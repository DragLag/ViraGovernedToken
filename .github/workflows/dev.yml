name: dev — test & deploy

on:
  push:
    branches:
      - dev

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Validate secrets
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          INFURA_API_KEY: ${{ secrets.INFURA_API_KEY }}
        run: |
          if [ -z "$PRIVATE_KEY" ]; then echo "ERROR: PRIVATE_KEY secret not set"; exit 1; fi
          if [ "${#PRIVATE_KEY}" -lt 64 ]; then echo "ERROR: PRIVATE_KEY too short (${#PRIVATE_KEY} chars, need 64)"; exit 1; fi
          if [ -z "$INFURA_API_KEY" ]; then echo "ERROR: INFURA_API_KEY secret not set"; exit 1; fi
          echo "Secrets OK (key length: ${#PRIVATE_KEY})"

      - name: Install dependencies
        run: npm install

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run tests
        run: npx hardhat test

      - name: Deploy to Polygon Amoy
        id: deploy
        env:
          INFURA_API_KEY: ${{ secrets.INFURA_API_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
        run: |
          OUTPUT=$(npx hardhat run scripts/initialize.js --network amoyInfura 2>&1)
          echo "$OUTPUT"
          ADDRESS=$(echo "$OUTPUT" | grep "ViraGovernedToken deployed to:" | awk '{print $NF}')
          echo "contract_address=$ADDRESS" >> $GITHUB_OUTPUT

      - name: Verify on Polygonscan
        env:
          INFURA_API_KEY: ${{ secrets.INFURA_API_KEY }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
        run: npx hardhat verify --network amoyInfura ${{ steps.deploy.outputs.contract_address }}

      - name: Print contract address
        run: echo "Contract deployed at ${{ steps.deploy.outputs.contract_address }}"
