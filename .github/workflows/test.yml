name: Main CI for Dev Branch

on:
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        
    - name: Install dependencies
      run: |
        npm install -g npm@10.9.4
        npm install -g ganache@7.2.0
        npm install
        
    - name: Lint Solidity
      uses: smartcontracts/hardhat-github-action@v1.1.1
      with:
        command: npx eslint . --ext .js

    - name: Compile contracts
      uses: smartcontracts/hardhat-github-action@v1.1.1
      with:
        command: npx hardhat compile

    - name: Run tests
      uses: smartcontracts/hardhat-github-action@v1.1.1
      with:
        command: npx hardhat test

    - name: Report status
      if: always()
      uses: actions/github-script@v6
      with:
        script: |
          const status = context.payload.workflow_run.conclusion === 'success' ? '✅ All checks passed' : '❌ Some checks failed';
          const sha = context.payload.workflow_run.head_sha;
          await github.rest.repos.createStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha,
            state: context.payload.workflow_run.conclusion === 'success' ? 'success' : 'failure',
            description: context.payload.workflow_run.conclusion === 'success' ? 'All checks passed' : 'Some checks failed',
            context: 'ci/hardhat'
          });
          
          // Comment on PR with results
          if (context.payload.workflow_run.pull_requests.length > 0) {
            const prNumber = context.payload.workflow_run.pull_requests[0].number;
            await github.rest.issues.create_comment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `### 🤖 CI Status\n\n${status}`
            });
          }