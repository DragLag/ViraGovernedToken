name: Test Smart Contract

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: 18.x
        
    - name: Install dependencies
      run: |
        npm install -g npm@10.9.4
        npm install -g ganache@7.2.0
        npm install
        
    - name: Run tests
      run: |
        npx hardhat test
        
    - name: Compile contracts
      run: |
        npx hardhat compile